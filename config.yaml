wake_word:
  model: hey_jarvis
  threshold: 0.5
  chunk_size: 1280
stt:
  model: small
  device: cuda
  compute_type: int8
llm:
  active_provider: openrouter
  temperature: 0.7
  providers:
    openrouter:
      type: openai
      label: OpenRouter (Free Models Router)
      model: openrouter/free
      base_url: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
context:
  max_messages: 10
  summarize_after: 8
  max_tokens: 2500
tts:
  voice: af_heart
  speed: 1.1
memory:
  db_path: jarvis/data/memory.db
  chroma_path: jarvis/data/chroma
  top_k: 3
tools:
  allowed_paths:
  - ~/Documents
  - ~/Desktop
  code_timeout: 10
